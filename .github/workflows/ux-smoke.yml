name: Homologação automatizada de UX mobile (Chromium)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'README.md'
      - 'scripts/smoke-mobile.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ux-smoke.yml'

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Instalar Chromium de teste (isolado do deploy)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compilar a aplicação
        run: npm run build
      - name: Conferir usabilidade 360/390/768/1280px, teclado e tema
        run: node scripts/smoke-mobile.cjs
      - name: Publicar capturas para homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-webgis-saude-mobile
          path: artifacts/mobile-ux
          if-no-files-found: ignore
          retention-days: 7
